<div class="login-wrapper col-xs-12 col-sm-4 col-md-6 col-lg-4 mx-auto px-auto">
  <mat-card>
    <mat-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
        <mat-form-field>
          <input
            type="text"
            matInput
            [placeholder]="usernamePlaceholder"
            formControlName="userId"
          />
          <mat-error *ngIf="loginForm.controls['userId'].invalid"
            >Please enter username</mat-error
          >
        </mat-form-field>

        <mat-form-field>
          <input
            type="password"
            matInput
            placeholder="Password"
            formControlName="password"
          />
          <mat-error *ngIf="loginForm.controls['password'].invalid"
            >Please enter password</mat-error
          >
        </mat-form-field>

        <mat-error *ngIf="error"> {{ errorMessage }} </mat-error>

        <div class="btn-wrapper">
          <button
            *ngIf="userType === 'admin'"
            type="submit"
            [routerLink]="['/user/login']"
            mat-button
          >
            User Sign In
          </button>
          <button class="button" type="submit" mat-button>Sign In</button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
